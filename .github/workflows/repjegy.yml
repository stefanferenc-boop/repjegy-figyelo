- name: Run python repjegy_figyelo.py
  timeout-minutes: 4   # Biztonsági háló: ha 4 perc alatt nem végez, a GitHub leállítja
  env:
    TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  run: |
    pip install playwright
    playwright install chromium
    python repjegy_figyelo.py
